# E2E Regression — three-tier gating model.
#
# Generated by `devaudit install` / `devaudit update` from sdlc-config.json
# (opt-in via e2e_regression_enabled — DevAudit-Installer#821).
# Do not edit manually — re-run the CLI (`devaudit update`) to regenerate.
#
# Three-tier gating model (see SDLC/Test_Strategy.md § "E2E gating model —
# three tiers"):
#
#   - smoke      — runs on develop push via ci.yml (no change here)
#   - critical   — Playwright project selecting e2e/smoke/ + e2e/critical/
#                  (this workflow on PR-to-main)
#   - regression — all e2e/**/*.spec.ts after a successful production
#                  deployment status, or manual dispatch
#
# The PR-to-main path runs the critical tier so velocity isn't blocked on
# the full regression suite. The post-deployment path runs full regression
# against the deployed SHA + auto-files a `bug, priority:high` issue on
# failure — the safety net that catches anything the critical tier let
# through. Requires playwright.config.ts to define `smoke`/`critical`/
# `regression` projects; falls back to `smoke` on PR-to-main if `critical`
# isn't defined yet, so onboarding doesn't start red.

name: E2E Regression

on:
  workflow_dispatch:
    inputs:
      specs:
        description: 'Space-separated spec paths or --grep pattern. Empty = full regression. Used during fix-and-verify iterations to keep the loop fast.'
        required: false
        type: string
        default: ''
      runner_label:
        description: 'Optional one-run runner label override. Blank uses repository CI_RUNNER_LABEL.'
        required: false
  # PR-to-main runs the critical tier (smoke + e2e/critical/). Successful
  # production deployment runs the full regression safety net; manual
  # dispatch supports intentional operator-triggered full or scoped runs.
  pull_request:
    branches: [main]
  deployment_status:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write # post-merge auto-issue on regression failure

jobs:
  e2e-regression:
    name: E2E Regression Suite
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'production' ||
        github.event.deployment.environment == 'prod' ||
        endsWith(github.event.deployment.environment, '/ production')))
    runs-on: ${{ (inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-ci') == 'github-ci' && 'ubuntu-latest' || (inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-ci') }}
    # Keep the job budget above the Playwright budget so timeout metadata and
    # partial evidence can be retained before GitHub terminates the runner.
    timeout-minutes: 55

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB_NAME: wawagardenbar_test
      # sdlc-config.json's app_env values ci.yml's smoke/critical gates
      # already set — missing here entirely in the generated template
      # (wawagardenbar-app#897: discovered when SESSION_PASSWORD's absence
      # produced "iron-session: Bad usage. Missing password." on every
      # login attempt, failing auth-setup before any regression spec runs).
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_PASSWORD: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: E2eTest@2026!
      E2E_SUPER_ADMIN_USERNAME: e2e-superadmin
      E2E_SUPER_ADMIN_PASSWORD: E2eTest@2026!
      E2E_CSR_USERNAME: e2e-csr
      E2E_CSR_PASSWORD: E2eTest@2026!
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      MONNIFY_SECRET_KEY: ${{ secrets.MONNIFY_SECRET_KEY }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      ENABLE_E2E_PIN_INTERCEPT: true

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history for E2E_NEW_SPECS computation (origin-tag captures
          # which specs were added in this PR/push so evidence shots tag
          # them as `origin: 'feature'` vs accumulating `regression`).
          fetch-depth: 0
          ref: ${{ github.event.deployment.sha || github.sha }}
          clean: ${{ (inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-ci') == 'github-ci' && 'true' || 'false' }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install${{ (inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-ci') == 'github-ci' && ' --with-deps' || '' }} chromium

      # Decide which Playwright project to run based on the trigger, and
      # whether this run qualifies for sharding. Moved ahead of the
      # dev-server steps (was previously right before "Record E2E
      # execution context") so both the unsharded and sharded paths below
      # can branch on `steps.select.outputs.*` from the start.
      #
      # PR-to-main runs `critical`; push/deploy-to-main runs `regression`;
      # workflow_dispatch runs regression with optional spec filter for
      # scoped iteration.
      #
      # Fallback: if the `critical` project isn't defined in
      # playwright.config.ts (e.g. during migration), fall back to `smoke`
      # so PR-to-main stays green. Detected via a simple grep of the
      # config file.
      #
      # Sharding (wawagardenbar-app#897, closing #832): only the full,
      # unscoped `regression` run (deployment_status, or workflow_dispatch
      # with no `specs` filter) qualifies. The critical tier is already
      # fast and warmed; a scoped workflow_dispatch run is by definition
      # small. Neither hits the accumulated process/connection-degradation
      # failure class #832 diagnosed (isolated reruns pass clean, no
      # positional/host-ceiling correlation, failure rate scales with
      # total tests executed) — see e2e-ci-reliability skill's
      # diagnostic-playbook.md.
      - name: Determine E2E project + spec selector
        id: select
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          case "$EVENT" in
            pull_request)
              if grep -qE "name:\s*['\"]critical['\"]" playwright.config.ts 2>/dev/null; then
                echo "project=critical" >> "$GITHUB_OUTPUT"
                echo "Using critical-tier project (smoke + e2e/critical/)"
              else
                echo "project=smoke" >> "$GITHUB_OUTPUT"
                echo "::warning::No 'critical' Playwright project defined; falling back to smoke."
              fi
              echo "specs=" >> "$GITHUB_OUTPUT"
              echo "sharded=false" >> "$GITHUB_OUTPUT"
              ;;
            deployment_status)
              echo "project=regression" >> "$GITHUB_OUTPUT"
              echo "specs=" >> "$GITHUB_OUTPUT"
              echo "sharded=true" >> "$GITHUB_OUTPUT"
              echo "Running full regression project (sharded)"
              ;;
            workflow_dispatch)
              echo "project=regression" >> "$GITHUB_OUTPUT"
              echo "specs=${{ github.event.inputs.specs }}" >> "$GITHUB_OUTPUT"
              if [ -n "${{ github.event.inputs.specs }}" ]; then
                echo "sharded=false" >> "$GITHUB_OUTPUT"
                echo "Scoped dispatch: ${{ github.event.inputs.specs }}"
              else
                echo "sharded=true" >> "$GITHUB_OUTPUT"
                echo "Unscoped dispatch — running full regression project (sharded)"
              fi
              ;;
          esac

      - name: E2E setup
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: wawagardenbar_test
          E2E_ADMIN_USERNAME: e2e-admin
          E2E_ADMIN_PASSWORD: E2eTest@2026!
          E2E_SUPER_ADMIN_USERNAME: e2e-superadmin
          E2E_SUPER_ADMIN_PASSWORD: E2eTest@2026!
          E2E_CSR_USERNAME: e2e-csr
          E2E_CSR_PASSWORD: E2eTest@2026!
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          MONNIFY_SECRET_KEY: ${{ secrets.MONNIFY_SECRET_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          ENABLE_E2E_PIN_INTERCEPT: true
        run: |
          npx tsx scripts/seed-e2e-admins.ts
          npx tsx scripts/seed-food-menu.ts
          npx tsx scripts/seed-drinks-menu.ts
          npx tsx scripts/seed-inventory.ts

      - name: Start dev server
        if: steps.select.outputs.sharded != 'true'
        run: |
          set -euo pipefail
          npm run dev > e2e-server.log 2>&1 &
          echo "$!" > .e2e-server.pid
          echo "Started E2E server pid $(cat .e2e-server.pid)"

      - name: Wait for dev server
        if: steps.select.outputs.sharded != 'true'
        # `wait-on` owns its internal readiness budget, but a process-level
        # deadline is needed so a hung child cannot leave the required check
        # in progress until the job-level timeout.
        run: timeout --signal=TERM --kill-after=15s 150s npx wait-on http://localhost:3000 --timeout 120000

      - name: Warm up dev-compiled routes
        if: steps.select.outputs.sharded != 'true'
        # DevAudit-Installer#793/#820/#821 — the full critical/regression
        # tier hammers rarely-hit routes that `npm run dev`-equivalent
        # servers JIT-compile on first request. That cold-compile tax
        # (observed up to several seconds per route on a loaded self-hosted
        # runner) competes with Playwright's fixed per-assertion timeouts
        # and produces intermittent, non-reproducible failures — a
        # different unrelated test failing each run, never the same one
        # twice, easily misread as a code regression.
        #
        # Serving a production build instead was tried on the motivating
        # consumer and reverted: for a Next.js app it silently turns on
        # production-only <Link> prefetching, which keeps link-heavy pages'
        # background network traffic alive indefinitely — breaking any
        # `waitForLoadState('networkidle')`-style wait with reproducible
        # timeouts. Fixing that pattern suite-wide is real, separate scope,
        # not something to fold into this fix, and may not even apply to
        # every stack this template is used with.
        #
        # Instead, pre-compile every route the suite actually visits (mined
        # straight from the specs, so this self-maintains as routes are
        # added) by hitting each once before the timed test run starts —
        # the JIT cost lands here, off the Playwright-timeout clock. This
        # assumes specs consistently write literal `page.goto('/path')`
        # calls; a spec that builds paths dynamically just doesn't
        # contribute a route here (the loop tolerates zero matches) rather
        # than failing.
        run: |
          set -uo pipefail
          grep -ohrE "page\.goto\('/[^']*'\)" e2e/ \
            | sed -E "s/page\.goto\('(.*)'\)/\1/" \
            | sed -E 's/\?.*//' \
            | sort -u \
            | while read -r route; do
                curl -sf -o /dev/null --max-time 20 "http://localhost:3000$route" || true
              done
          echo "Warmed $(grep -ohrE "page\.goto\('/[^']*'\)" e2e/ | sed -E "s/page\.goto\('(.*)'\)/\1/" | sed -E 's/\?.*//' | sort -u | wc -l) routes"

      - name: Record E2E execution context
        if: steps.select.outputs.sharded != 'true'
        run: |
          set -euo pipefail
          SERVER_PID="$(cat .e2e-server.pid 2>/dev/null || true)"
          jq -n \
            --arg targetUrl "http://localhost:3000" \
            --arg project "${{ steps.select.outputs.project }}" \
            --arg specs "${{ steps.select.outputs.specs }}" \
            --arg serverStart "start command (pid ${SERVER_PID:-unknown})" \
            --arg serverStop "kill ${SERVER_PID:-unknown}" \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson timeoutMinutes 40 \
            '{target_url: $targetUrl, project: $project, selected_specs: $specs, test_server_start: $serverStart, test_server_stop: $serverStop, timeout_minutes: $timeoutMinutes, started_at: $startedAt, outcome: "running"}' \
            > e2e-regression-metadata.json

      - name: E2E Regression Tests
        if: steps.select.outputs.sharded != 'true'
        env:
          PLAYWRIGHT_HTML_REPORTER_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-regression-results.json
        run: |
          set -uo pipefail
          PROJECT="${{ steps.select.outputs.project }}"
          SPECS="${{ steps.select.outputs.specs }}"
          # `cmd; STATUS=$?` loses the exit code under this step's default
          # `bash -e` shell: a failing command aborts the script before
          # `STATUS=$?` is reached. `cmd || STATUS=$?` keeps the compound
          # statement's exit status 0 on failure, so `-e` never fires
          # (wawagardenbar-app#897 — found while verifying the sharded path,
          # same bug class applies here).
          STATUS=0
          if [ -n "$SPECS" ]; then
            echo "::notice::Running scoped regression — project=$PROJECT specs=$SPECS"
            # shellcheck disable=SC2086
            timeout --signal=TERM --kill-after=60s 40m npx playwright test --project="$PROJECT" --reporter=json,html $SPECS || STATUS=$?
          else
            echo "::notice::Running project=$PROJECT"
            timeout --signal=TERM --kill-after=60s 40m npx playwright test --project="$PROJECT" --reporter=json,html || STATUS=$?
          fi
          if [ "$STATUS" -eq 124 ]; then
            OUTCOME="timed_out"
            echo "::error::E2E regression exceeded its 40-minute execution budget. Partial evidence will be uploaded."
          elif [ "$STATUS" -eq 0 ]; then
            OUTCOME="passed"
          else
            OUTCOME="failed"
          fi
          jq --arg outcome "$OUTCOME" --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson exitCode "$STATUS" \
            '. + {outcome: $outcome, completed_at: $completedAt, exit_code: $exitCode}' \
            e2e-regression-metadata.json > e2e-regression-metadata.tmp
          mv e2e-regression-metadata.tmp e2e-regression-metadata.json
          exit "$STATUS"

      # Sharded full-regression run (wawagardenbar-app#897, closes #832).
      #
      # #832 diagnosed the unsharded 576-test/38-min single-worker run as
      # accumulated process/connection-degradation: a different unrelated
      # spec fails each run, isolated reruns of the same specs pass clean
      # 3/3, and the failure rate (~33-50% across repeated full runs) scales
      # with total tests executed rather than correlating with a specific
      # position or a host resource ceiling. Sharding — restarting the dev
      # server fresh between shards — breaks the long-lived-process/
      # connection-pool pattern without the added cost of a DB reset per
      # shard (the lighter fix; see e2e-ci-reliability's reliability-fixes.md).
      #
      # SHARD_COUNT=4 / ~12min-per-shard budget is a starting point (per the
      # skill's own guidance), not a hard rule — tune against actual
      # per-shard wall-clock once this has run for real. Only self-contained
      # in one job step (a loop, not a GitHub Actions matrix) so the
      # existing evidence-upload and auto-issue-filing steps below don't
      # need a parallel-job redesign.
      - name: Run sharded E2E regression (N shards)
        if: steps.select.outputs.sharded == 'true'
        env:
          PLAYWRIGHT_HTML_REPORTER_OPEN: never
          SHARD_COUNT: 4
          SHARD_TIMEOUT_MINUTES: 12
        run: |
          set -uo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          OVERALL_STATUS=0
          OVERALL_OUTCOME="passed"

          for i in $(seq 1 "$SHARD_COUNT"); do
            echo "::group::Shard $i/$SHARD_COUNT"

            echo "Starting dev server for shard $i"
            npm run dev > "e2e-server-shard-$i.log" 2>&1 &
            echo "$!" > .e2e-server.pid
            echo "Started E2E server pid $(cat .e2e-server.pid) for shard $i"

            timeout --signal=TERM --kill-after=15s 150s npx wait-on http://localhost:3000 --timeout 120000

            # Same route-warm-up as the unsharded path (DevAudit-Installer#793)
            # — each shard gets a fresh dev-server process, so the JIT
            # cold-compile tax applies per shard, not just once per job.
            grep -ohrE "page\.goto\('/[^']*'\)" e2e/ \
              | sed -E "s/page\.goto\('(.*)'\)/\1/" \
              | sed -E 's/\?.*//' \
              | sort -u \
              | while read -r route; do
                  curl -sf -o /dev/null --max-time 20 "http://localhost:3000$route" || true
                done

            # `cmd; STATUS=$?` loses the exit code under this step's default
            # `bash -e` shell (GitHub Actions' default `run:` shell): a
            # nonzero exit from the command aborts the script immediately,
            # before `STATUS=$?` is ever reached — silently killing the loop
            # after shard 1 every time a shard has any failing test. The
            # `cmd || STATUS=$?` form keeps the compound statement's own
            # exit status 0 on failure (the assignment succeeds), so `-e`
            # never fires.
            SHARD_STATUS=0
            PLAYWRIGHT_JSON_OUTPUT_NAME="e2e-regression-results-shard-$i.json" \
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report-shard-$i" \
              timeout --signal=TERM --kill-after=60s "${SHARD_TIMEOUT_MINUTES}m" \
              npx playwright test --project=regression --shard="$i/$SHARD_COUNT" \
                --reporter=json,html --output="test-results-shard-$i" || SHARD_STATUS=$?
            echo "Shard $i/$SHARD_COUNT exit status: $SHARD_STATUS"

            echo "Stopping dev server for shard $i"
            if [ -f .e2e-server.pid ]; then
              PID="$(cat .e2e-server.pid)"
              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID"
                wait "$PID" 2>/dev/null || true
              fi
              rm -f .e2e-server.pid
            fi

            if [ "$SHARD_STATUS" -eq 124 ]; then
              OVERALL_OUTCOME="timed_out"
              OVERALL_STATUS=124
              echo "::error::Shard $i/$SHARD_COUNT exceeded its ${SHARD_TIMEOUT_MINUTES}-minute execution budget."
            elif [ "$SHARD_STATUS" -ne 0 ] && [ "$OVERALL_STATUS" -ne 124 ]; then
              OVERALL_OUTCOME="failed"
              OVERALL_STATUS=1
            fi
            echo "::endgroup::"
          done

          echo "Merging $SHARD_COUNT shard JSON reports into e2e-regression-results.json"
          if ls e2e-regression-results-shard-*.json >/dev/null 2>&1; then
            jq -s '.' e2e-regression-results-shard-*.json > e2e-regression-results.json \
              || echo "::warning::failed to merge shard JSON reports (malformed shard output?)"
          fi

          jq -n \
            --arg targetUrl "http://localhost:3000" \
            --arg project "regression" \
            --arg specs "" \
            --argjson sharded true \
            --argjson shardCount "$SHARD_COUNT" \
            --arg serverStart "npm run dev, restarted per shard" \
            --arg serverStop "killed per shard" \
            --arg startedAt "$STARTED_AT" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson timeoutMinutes "$((SHARD_COUNT * SHARD_TIMEOUT_MINUTES))" \
            --arg outcome "$OVERALL_OUTCOME" \
            --argjson exitCode "$OVERALL_STATUS" \
            '{target_url: $targetUrl, project: $project, selected_specs: $specs, sharded: $sharded, shard_count: $shardCount, test_server_start: $serverStart, test_server_stop: $serverStop, timeout_minutes: $timeoutMinutes, started_at: $startedAt, completed_at: $completedAt, outcome: $outcome, exit_code: $exitCode}' \
            > e2e-regression-metadata.json

          exit "$OVERALL_STATUS"

      - name: Stop dev server
        if: always()
        run: |
          set -euo pipefail
          if [ -f .e2e-server.pid ]; then
            PID="$(cat .e2e-server.pid)"
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              wait "$PID" 2>/dev/null || true
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: e2e-regression-report
          path: |
            e2e-regression-results.json
            e2e-regression-metadata.json
            playwright-report/
            # Playwright writes per-test traces, videos, screenshots and
            # error-context.md to test-results/<spec>-<title>[-retry<N>]/
            # — spec-named, unlike playwright-report/data/<hash>.zip. Include
            # them so failed-test triage doesn't need to walk the hash index
            # in the HTML report: `npx playwright show-trace
            # test-results/<spec-test>/trace.zip` resolves the failure in one
            # step. Storage cost is a duplicate of the data already in
            # playwright-report/data/, accepted for the debuggability win.
            test-results/
            e2e-server.log
            # Sharded-run shapes (wawagardenbar-app#897) — same rationale as
            # above, per shard, since a sharded run never writes the
            # unsharded paths above.
            playwright-report-shard-*/
            test-results-shard-*/
            e2e-regression-results-shard-*.json
            e2e-server-shard-*.log
          if-no-files-found: warn
          retention-days: 30

      # ─────────────────────────────────────────────────────────────────
      # Post-deployment auto-issue on regression failure.
      #
      # The 3-tier model's safety net: catches regressions that slipped
      # past the critical-tier PR gate. Opens a `bug, priority:high`
      # issue tagging the merge commit + the failing specs so the
      # operator can triage within working hours.
      #
      # No auto-revert — that's intentionally an operator decision per
      # the framework. False positives + flakes + UAT-data drift are
      # real classes; the operator handles each individually (hotfix,
      # revert, or accept-with-recorded-rationale).
      # ─────────────────────────────────────────────────────────────────
      - name: Open hotfix issue on post-merge regression
        if: failure() && github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MERGE_SHA="${{ github.sha }}"
          MERGE_SHA_SHORT=$(echo "$MERGE_SHA" | cut -c1-7)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Extract failing spec names from the JSON reporter output if available.
          FAILING=""
          if [ -f e2e-regression-results.json ]; then
            FAILING=$(jq -r '
              [.. | objects | select(.status == "failed" or .status == "timedOut") | .title // empty]
              | unique | .[]
            ' e2e-regression-results.json 2>/dev/null | head -20 || true)
          fi
          if [ -z "$FAILING" ]; then
            FAILING="(see the failing run logs — could not parse spec titles from reporter output)"
          fi

          BODY=$(cat <<EOF
          ## Post-merge regression caught on \`main\`

          The full regression suite failed on the post-merge run for commit \`${MERGE_SHA_SHORT}\`. The critical-tier PR gate let this slip through.

          **Failing specs (best-effort extracted from the JSON reporter):**

          \`\`\`
          ${FAILING}
          \`\`\`

          **Triage actions:**

          - [ ] Read the run log: ${RUN_URL}
          - [ ] Pull \`e2e-regression-report\` artifact from the run; inspect \`test-results/<spec>/error-context.md\` for page state at failure
          - [ ] Decide: hotfix on \`main\`, revert \`${MERGE_SHA_SHORT}\`, or accept-with-rationale if the failure is environmental
          - [ ] If the failing spec is a Must-tier candidate that should have caught this pre-merge, move it from \`e2e/\` to \`e2e/critical/\` so the next PR-to-main runs it

          **Auto-filed by:** \`e2e-regression.yml\` (DevAudit-Installer#821 3-tier gating)
          EOF
          )

          gh issue create \
            --title "[hotfix] Post-merge regression on \`${MERGE_SHA_SHORT}\` — full E2E failed" \
            --body "$BODY" \
            --label "bug,priority:high"
