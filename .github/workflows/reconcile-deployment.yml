name: Reconcile Verified Host Deployment

# Webhook-loss recovery for the railway host adapter (devaudit-installer#841, #1022).
# When the hosting provider deployed correctly but its deployment_status event never
# reached GitHub, the post-deploy gate waits forever. Dispatch this with the provider's
# own deployment id: it is looked up (scripts/lookup-deployment-railway.sh), verified
# against the expected SHA and a health probe, and the GitHub deployment status the
# provider failed to post is recorded.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'REQ-XXX release receiving recovery evidence'
        required: true
      expected_sha:
        description: 'Exact main SHA verified at the provider'
        required: true
      github_deployment_id:
        description: 'Existing GitHub deployment ID to reconcile'
        required: true
      provider_deployment_id:
        description: 'Terminal-successful railway deployment ID'
        required: true
      provider_project:
        description: 'railway project ID'
        required: true
      provider_service:
        description: 'railway service ID or name (leave blank when the host has no services)'
        required: false
      health_url:
        description: 'Configured production health URL'
        required: true
      runner_label:
        description: 'Optional one-run runner label override. Blank uses repository CI_RUNNER_LABEL.'
        required: false

jobs:
  reconcile:
    name: Verify and reconcile deployment
    runs-on: ${{ (inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-ci') == 'github-ci' && 'ubuntu-latest' || (inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-ci') }}
    permissions:
      contents: read
      deployments: write
    env:
      DEVAUDIT_API_KEY: ${{ secrets.DEVAUDIT_API_KEY }}
      DEVAUDIT_BASE_URL: ${{ vars.DEVAUDIT_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          # See ci.yml.template's checkout step for why (devaudit-installer#676/#815).
          clean: ${{ (inputs.runner_label || vars.CI_RUNNER_LABEL || 'github-ci') == 'github-ci' && 'true' || 'false' }}
      - name: Verify provider deployment before reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          DEVAUDIT_PROBE_HEADER: ${{ secrets.DEVAUDIT_PROBE_HEADER }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          chmod +x scripts/reconcile-deployment.sh scripts/lookup-deployment-railway.sh
          bash scripts/reconcile-deployment.sh \
            --provider="railway" \
            --repo="${{ github.repository }}" --sha="${{ inputs.expected_sha }}" \
            --github-deployment-id="${{ inputs.github_deployment_id }}" \
            --provider-deployment-id="${{ inputs.provider_deployment_id }}" \
            --provider-project="${{ inputs.provider_project }}" --provider-service="${{ inputs.provider_service }}" \
            --health-url="${{ inputs.health_url }}"
      - name: Upload manual reconciliation evidence
        run: |
          bash scripts/upload-evidence.sh wgb "${{ inputs.release }}" test_report deployment-reconciliation.json \
            --category release_artifact --release "${{ inputs.release }}" --environment production \
            --git-sha "${{ inputs.expected_sha }}" --branch main --sdlc-stage 5 \
            --meta-key 'provenance=manual_reconciliation' --meta-key 'provider=railway'
