apiVersion: apps/v1
kind: Deployment
metadata:
  name: wawagardenbar-uat-app
  namespace: apps
  labels:
    app.kubernetes.io/name: wawagardenbar-app
    app.kubernetes.io/instance: uat
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wawagardenbar-app
      app.kubernetes.io/instance: uat
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wawagardenbar-app
        app.kubernetes.io/instance: uat
        app.kubernetes.io/component: app
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/metasession-dev/wawagardenbar-app:develop # CONFIRM correct tag before first apply
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: wawagardenbar-uat-env
            - secretRef:
                name: wawagardenbar-uat-mongo-creds # MONGODB_WAWAGARDENBAR_APP_URI / MONGODB_URI — provisioned against the shared Mongo, see k3s/manifests/README.md in the platform config repo
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
